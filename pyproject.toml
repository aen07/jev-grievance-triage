[project]
name = "jev-grievance-triage"
version = "0.1.0"
description = "Auditable grievance triage: calibrated Jev judgments, deterministic policy code, human-in-the-loop review."
requires-python = ">=3.11"
dependencies = [
  "typesafe-sdk==0.7.5",
  "pydantic>=2.7,<3",
  "pyyaml>=6",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
ui = ["streamlit>=1.38", "httpx>=0.27", "pandas>=2", "altair>=5"]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.45"]

[project.scripts]
triage = "triage.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["triage", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
